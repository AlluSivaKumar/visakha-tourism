server:
  port: 8080

spring:
  application:
    name: visakha-tourism
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/visakha_tourism?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Siva@2005}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:${MAIL_USERNAME:sivakumarallu4@gmail.com}}
    password: ${SMTP_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET:d41d8cd98f00b204e9800998ecf8427e9a82f34e6b1c85d72049e3fa185bc029a174829375b48194e823758194a73b21}
