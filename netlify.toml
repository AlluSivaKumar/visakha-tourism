# Netlify Configuration for Visakha Tourism Frontend

[build]
  # Directory where frontend HTML/CSS/JS files reside
  publish = "frontend"

# Convenience redirects for removed user auth
[[redirects]]
  from = "/login"
  to = "/admin-login.html"
  status = 302

[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 302

# Reverse Proxy for Spring Boot Backend API
[[redirects]]
  from = "/api/*"
  to = "https://visakha-tourism-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for root path
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
