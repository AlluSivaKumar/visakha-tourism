<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email OTP - Visakha Tourism</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🌊</div>
        <span>Visakha Tourism</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/destinations.html" class="nav-link">Destinations</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-sm btn-outline">Log In</a>
      </div>
    </div>
  </header>

  <!-- Verify OTP Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Email Verification</span>
        <h1 class="auth-title">Enter Verification Code</h1>
        <p class="auth-subtitle">We sent a 6-digit OTP code to:</p>
        <p id="target-email" style="font-weight:700; color:var(--primary); margin-top:4px;">name@example.com</p>
      </div>

      <div id="verify-alert" style="display:none; padding:12px 16px; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:20px;"></div>

      <form id="otp-form">
        <div class="otp-input-container">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autofocus>
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]">
        </div>

        <div class="timer-box">
          Code expires in: <span id="expiry-timer" class="timer-text">05:00</span>
        </div>

        <button type="submit" id="verify-btn" class="btn btn-primary" style="width:100%; padding:12px;">
          Verify & Activate Account
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.88rem; color:var(--text-muted);">
        Didn't receive the code?
        <button id="resend-btn" class="btn btn-sm btn-outline" style="margin-left:8px;" disabled>
          Resend in <span id="cooldown-sec">60</span>s
        </button>
      </div>

      <div style="text-align:center; margin-top:20px;">
        <a href="/register.html" style="font-size:0.82rem; color:var(--text-muted);">Change email address</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, showToast } from '/js/api.js';
    import { setSession } from '/js/auth.js';

    const targetEmail = sessionStorage.getItem('pending_verification_email');
    if (!targetEmail) {
      window.location.href = '/register.html';
    }

    document.getElementById('target-email').textContent = targetEmail;

    const alertBox = document.getElementById('verify-alert');
    const verifyBtn = document.getElementById('verify-btn');
    const resendBtn = document.getElementById('resend-btn');
    const expiryTimerEl = document.getElementById('expiry-timer');
    const cooldownSecEl = document.getElementById('cooldown-sec');
    const otpBoxes = document.querySelectorAll('.otp-box');

    // Setup OTP boxes auto-focus & paste handling
    otpBoxes.forEach((box, idx) => {
      box.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && idx < otpBoxes.length - 1) {
          otpBoxes[idx + 1].focus();
        }
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && idx > 0) {
          otpBoxes[idx - 1].focus();
        }
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        text.split('').forEach((char, i) => {
          if (otpBoxes[i]) otpBoxes[i].value = char;
        });
        if (otpBoxes[text.length - 1]) {
          otpBoxes[text.length - 1].focus();
        }
      });
    });

    // 5-minute expiry countdown
    let expiryRemaining = 300;
    const expiryInterval = setInterval(() => {
      expiryRemaining--;
      if (expiryRemaining <= 0) {
        clearInterval(expiryInterval);
        expiryTimerEl.textContent = 'EXPIRED';
        expiryTimerEl.style.color = '#dc2626';
      } else {
        const m = String(Math.floor(expiryRemaining / 60)).padStart(2, '0');
        const s = String(expiryRemaining % 60).padStart(2, '0');
        expiryTimerEl.textContent = `${m}:${s}`;
      }
    }, 1000);

    // 60-second resend cooldown
    let cooldownRemaining = 60;
    const cooldownInterval = setInterval(() => {
      cooldownRemaining--;
      if (cooldownRemaining <= 0) {
        clearInterval(cooldownInterval);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend Code';
      } else {
        cooldownSecEl.textContent = cooldownRemaining;
      }
    }, 1000);

    // Resend handler
    resendBtn.addEventListener('click', async () => {
      try {
        resendBtn.disabled = true;
        await api.post('/auth/resend-otp', {
          email: targetEmail,
          purpose: 'REGISTRATION'
        });
        showToast('Fresh verification code sent!', 'success');
        cooldownRemaining = 60;
        resendBtn.innerHTML = 'Resend in <span id="cooldown-sec">60</span>s';
      } catch (err) {
        showToast(err.message || 'Failed to resend code', 'error');
        resendBtn.disabled = false;
      }
    });

    // Verify form submit
    document.getElementById('otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      let otp = '';
      otpBoxes.forEach(b => otp += b.value);

      if (otp.length !== 6) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = 'Please enter all 6 digits of the verification code.';
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span class="spinner"></span> Verifying...';

      try {
        const res = await api.post('/auth/verify-email', {
          email: targetEmail,
          otp,
          purpose: 'REGISTRATION'
        });

        const authData = res.data;
        setSession(authData.token, {
          id: authData.userId,
          name: authData.name,
          email: authData.email,
          role: authData.role
        });

        sessionStorage.removeItem('pending_verification_email');
        showToast('Email verified successfully! Welcome aboard.', 'success');

        setTimeout(() => {
          window.location.href = '/destinations.html';
        }, 800);

      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = err.message || 'Verification failed. Please try again.';
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Activate Account';
      }
    });
  </script>
</body>
</html>
