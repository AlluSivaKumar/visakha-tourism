<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Visakha Tourism</title>
  <meta name="description" content="Create your free Visakha Tourism account to explore the City of Destiny and discover full destination itineraries and tour packages.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta property="og:site_name" content="Visakha Tourism">
  <meta property="og:image" content="https://visakhatourism.in/images/logo.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://visakhatourism.in/images/logo.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <img src="/images/logo.svg" alt="Visakha Tourism" style="width:34px; height:34px; border-radius:8px;">
        <span>Visakha Tourism</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/destinations.html" class="nav-link">Destinations</a></li>
        <li><a href="/itineraries.html" class="nav-link">Itineraries</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-sm btn-outline">Log In</a>
      </div>
    </div>
  </header>

  <!-- Register Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Traveler Registration</span>
        <h1 class="auth-title">Join Visakha Tourism</h1>
        <p class="auth-subtitle">Create your account to unlock full destination itineraries and packages</p>
      </div>

      <div id="register-alert" style="display:none; padding:12px 16px; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:20px;"></div>

      <!-- Continue with Google Button -->
      <button type="button" id="google-reg-btn" class="btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:#ffffff; color:#374151; border:1px solid #d1d5db; padding:12px; font-weight:600; font-size:0.95rem; box-shadow:0 1px 2px rgba(0,0,0,0.05); margin-bottom:18px; border-radius:var(--radius-md); cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google (Instant Sign Up)</span>
      </button>

      <div style="display:flex; align-items:center; text-align:center; margin-bottom:18px; color:var(--text-muted); font-size:0.82rem;">
        <span style="flex:1; border-bottom:1px solid var(--border-color);"></span>
        <span style="padding:0 12px; font-weight:600; letter-spacing:0.5px;">OR REGISTER WITH EMAIL</span>
        <span style="flex:1; border-bottom:1px solid var(--border-color);"></span>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Siva Kumar" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          <div class="form-hint">Fast signup with instant account activation.</div>
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-type your password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width:100%; margin-top:12px; padding:12px;">
          Create Free Account
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Already have an account? <a href="/login.html" style="font-weight:700;">Sign In</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, showToast } from '/js/api.js';
    import { setSession, isAuthenticated } from '/js/auth.js';
    import { setupGoogleSignInButton } from '/js/google-auth.js';

    const params = new URLSearchParams(window.location.search);
    const redirectUrl = params.get('redirect') || '/destinations.html';

    if (isAuthenticated()) {
      window.location.href = redirectUrl;
    }

    // Initialize Google Sign-in
    setupGoogleSignInButton('google-reg-btn', { redirectUrl });

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('register-alert');
    const submitBtn = document.getElementById('reg-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = 'Passwords do not match. Please verify both fields.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const res = await api.post('/auth/register', {
          name,
          email,
          password,
          confirmPassword
        });

        if (res.data && res.data.token) {
          setSession(res.data.token, {
            id: res.data.userId,
            name: res.data.name,
            email: res.data.email,
            role: res.data.role
          });
          showToast('Account created successfully! Welcome to Visakha Tourism.', 'success');
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 600);
        } else {
          showToast('Account created successfully! You can now log in.', 'success');
          setTimeout(() => {
            window.location.href = `/login.html?redirect=${encodeURIComponent(redirectUrl)}`;
          }, 600);
        }

      } catch (err) {
        console.error('Registration error:', err);
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = err.message || 'Registration failed. Please try again.';

        if (err.message && err.message.toLowerCase().includes('already exists')) {
          alertBox.innerHTML = `${err.message} <br><a href="/login.html" style="color:#b91c1c;font-weight:700;text-decoration:underline;margin-top:6px;display:inline-block;">Click here to Sign In →</a>`;
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Free Account';
      }
    });
  </script>
</body>
</html>
