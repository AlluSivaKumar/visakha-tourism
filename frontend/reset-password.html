<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Visakha Tourism</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🌊</div>
        <span>Visakha Tourism</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/destinations.html" class="nav-link">Destinations</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-sm btn-outline">Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Account Security</span>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter the verification code sent to your email and set a new password.</p>
      </div>

      <div id="reset-alert" style="display:none; padding:12px 16px; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:20px;"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="reset-email" class="form-label">Email Address</label>
          <input type="email" id="reset-email" class="form-input" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="reset-otp" class="form-label">6-Digit Reset Code (OTP)</label>
          <input type="text" id="reset-otp" class="form-input" placeholder="123456" required maxlength="6" pattern="[0-9]{6}">
        </div>

        <div class="form-group">
          <label for="reset-password" class="form-label">New Password</label>
          <input type="password" id="reset-password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="reset-confirm-password" class="form-label">Confirm New Password</label>
          <input type="password" id="reset-confirm-password" class="form-input" placeholder="Confirm your new password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary" style="width:100%; padding:12px;">
          Set New Password
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Back to <a href="/login.html" style="font-weight:700;">Login Page</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, showToast } from '/js/api.js';

    const savedEmail = sessionStorage.getItem('reset_password_email');
    if (savedEmail) {
      document.getElementById('reset-email').value = savedEmail;
    }

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('reset-alert');
    const submitBtn = document.getElementById('reset-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('reset-email').value.trim();
      const otp = document.getElementById('reset-otp').value.trim();
      const newPassword = document.getElementById('reset-password').value;
      const confirmPassword = document.getElementById('reset-confirm-password').value;

      if (newPassword !== confirmPassword) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Resetting password...';

      try {
        await api.post('/auth/reset-password', {
          email,
          otp,
          newPassword,
          confirmPassword
        });

        sessionStorage.removeItem('reset_password_email');
        showToast('Password reset successfully! You can now log in.', 'success');

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 800);

      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = err.message || 'Failed to reset password.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set New Password';
      }
    });
  </script>
</body>
</html>
