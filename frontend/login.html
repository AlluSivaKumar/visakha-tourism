<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Visakha Tourism</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🌊</div>
        <span>Visakha Tourism</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/destinations.html" class="nav-link">Destinations</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/register.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Login Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">User Portal</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your Visakha Tourism traveler account</p>
      </div>

      <div id="login-alert" style="display:none; padding:12px 16px; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:20px;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label for="login-password" class="form-label" style="margin-bottom:0;">Password</label>
            <a href="/forgot-password.html" style="font-size:0.82rem; font-weight:600;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%; margin-top:12px; padding:12px;">
          Sign In
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Don't have an account? <a href="/register.html" style="font-weight:700;">Create Account</a>
      </div>

      <div style="margin-top:28px; padding-top:20px; border-top:1px solid var(--border-color); text-align:center;">
        <a href="/admin-login.html" style="font-size:0.82rem; color:var(--text-muted); display:inline-flex; align-items:center; gap:6px;">
          🛡️ Administrator Sign In →
        </a>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, showToast } from '/js/api.js';
    import { setSession, isAuthenticated } from '/js/auth.js';

    if (isAuthenticated()) {
      window.location.href = '/profile.html';
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await api.post('/auth/login', { email, password });
        const authData = res.data;

        setSession(authData.token, {
          id: authData.userId,
          name: authData.name,
          email: authData.email,
          role: authData.role
        });

        showToast('Login successful! Welcome back.', 'success');

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/destinations.html';
        setTimeout(() => {
          window.location.href = redirect;
        }, 600);

      } catch (err) {
        console.error('Login error:', err);
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = err.message || 'Invalid email or password.';

        // If unverified, offer quick link to verify
        if (err.message && err.message.toLowerCase().includes('not yet verified')) {
          sessionStorage.setItem('pending_verification_email', email);
          alertBox.innerHTML += `<br><a href="/verify-otp.html" style="color:#b91c1c;font-weight:700;text-decoration:underline;margin-top:6px;display:inline-block;">Click here to enter OTP and verify now →</a>`;
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
