<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Visakha Tourism</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🌊</div>
        <span>Visakha Tourism</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/destinations.html" class="nav-link">Destinations</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-sm btn-outline">Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Account Recovery</span>
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your registered email to receive a password reset verification code.</p>
      </div>

      <div id="forgot-alert" style="display:none; padding:12px 16px; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:20px;"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email" class="form-label">Email Address</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn btn-primary" style="width:100%; padding:12px;">
          Send Reset Code
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Remembered your password? <a href="/login.html" style="font-weight:700;">Back to Login</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, showToast } from '/js/api.js';

    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('forgot-alert');
    const submitBtn = document.getElementById('forgot-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('forgot-email').value.trim();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Sending code...';

      try {
        await api.post('/auth/forgot-password', { email });
        sessionStorage.setItem('reset_password_email', email);
        showToast('Password reset code sent! Check your email.', 'success');

        setTimeout(() => {
          window.location.href = '/reset-password.html';
        }, 800);
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #f87171';
        alertBox.textContent = err.message || 'Failed to process request.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Code';
      }
    });
  </script>
</body>
</html>
